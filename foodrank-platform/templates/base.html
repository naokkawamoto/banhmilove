{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LOVEバインミー{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}地域とジャンルでバインミーランキングを探せるLOVEバインミー。{% endblock %}">
  <meta name="robots" content="{% block meta_robots %}index,follow{% endblock %}">
  <link rel="canonical" href="{% block canonical %}{{ request.scheme }}://{{ request.get_host }}{{ request.path }}{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}{% block og_title_fallback %}LOVEバインミー{% endblock %}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{% block og_description_fallback %}地域とジャンルでバインミーランキングを探せるLOVEバインミー。{% endblock %}{% endblock %}">
  <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/Banhmiicon.jpg' %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}{% block twitter_title_fallback %}LOVEバインミー{% endblock %}{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}{% block twitter_description_fallback %}地域とジャンルでバインミーランキングを探せるLOVEバインミー。{% endblock %}{% endblock %}">
  <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/Banhmiicon.jpg' %}">
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { background: #111827; color: #fff; padding: 12px 18px; position: sticky; top: 0; z-index: 10; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    .brand { font-weight: 800; margin-right: 10px; display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0.2px; font-size: 22px; color:#fff; }
    .brand-icon { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; transform: translateY(-1px); }
    nav a { color: #dbeafe; text-decoration: none; margin-right: 10px; font-size: 13px; }
    nav a:hover { color: #fff; text-decoration: underline; }
    main { max-width: 1100px; margin: 20px auto; padding: 0 16px 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    h1 { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #f9fafb; font-size: 14px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .pill { display: inline-block; font-size: 12px; color: var(--muted); background: #f3f4f6; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin: 0 0 14px; }
    .input { padding: 9px 10px; border:1px solid var(--line); border-radius: 8px; background:#fff; min-width: 220px; }
    .btn { padding: 9px 12px; border: 1px solid #1d4ed8; background: var(--accent); color:#fff; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <span class="brand">LOVE<img class="brand-icon" src="{% static 'images/Banhmiicon.jpg' %}" alt="Banh Mi Icon">バインミー</span>
    <nav>
      <a href="/">Home</a>
      <a href="/rank/">ランキング</a>
      <a href="/store_list/">全国バインミー店リスト</a>
      <a href="/news/">News</a>
      <a href="/about/">バインミーとは</a>
      <a href="/about_us/">About Us</a>
      <a href="/blog/">ブログ</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
